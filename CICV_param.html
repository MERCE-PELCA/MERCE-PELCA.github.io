  <style>
/* ---------- Couleurs propres à l'outil (les couleurs du site viennent de pelca.css) ---------- */
:root {
  --s1: #2a78d6;   /* scénario, fabrication */
  --s2: #eb6834;   /* usage */
  --s3: #1baf7a;   /* défaillances */
  --s5: #e87ba4;   /* fin d'usage */
  --ref: #7a7974;  /* référence */
  --good: #008300; --bad: #c43d3c;
  --good-soft: rgba(52, 199, 89, 0.16); --bad-soft: rgba(255, 59, 48, 0.13);
  --muted: #8a8a96;
  --grid: rgba(0, 0, 0, 0.07); --axis: rgba(0, 0, 0, 0.22);
  --track: #e6e6ee;
  --on: #7f82bc;
  --ctl-shadow: 0 1px 3px rgba(41, 41, 58, 0.14);
  --card-tint: linear-gradient(145deg, #7f82bc09, #e2a3b60c);
}

/* ---------- Mode nuit (posé par assets/theme.js) : couleurs propres à l'outil ---------- */
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #1b1b26; --card: #232331; --surface: #2a2a3a; --line: #363648;
  --text: #f2f2f7; --secondary: #b9b9c8; --muted: #8c8c9c; --header: rgba(27, 27, 38, 0.86);
  --accent: #b3b5e6; --violet: #9da0dc;
  --s1: #4a90e8; --s2: #e46a35; --s3: #22b07f; --s5: #e0699a; --ref: #a09f96;
  --good: #4cc24c; --bad: #ef7676; --good-soft: rgba(48, 209, 88, 0.18); --bad-soft: rgba(255, 69, 58, 0.18);
  --grid: rgba(255, 255, 255, 0.08); --axis: rgba(255, 255, 255, 0.26);
  --track: #34344a; --ctl-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  --card-tint: linear-gradient(145deg, #7f82bc16, #e2a3b60a);
}

/* ---------- Intro : texte à gauche, « Understanding the curve » à droite ---------- */
.lcic-intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 28px 48px; align-items: center; }
.lcic-lead { max-width: 800px; font-size: 1.25rem; line-height: 1.7; color: var(--secondary); margin-top: 20px; }
.lcic-scope.lcic-intro .read ul { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.lcic-authors { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.lcic-authors span { font-size: .875rem; font-weight: 550; color: var(--accent); padding: 6px 14px; border: 1px solid #7f82bc38; border-radius: 100px; background: #7f82bc09; }

/* ---------- Outil ---------- */
.lcic { width: min(1220px, calc(100% - 48px)); margin-inline: auto; padding-bottom: 36px; font-size: 15px; line-height: 1.4; }
.lcic-scope button { font: inherit; color: inherit; }

/* Barre d'outils : comparaison, écart, langue, reset, thème */
.lcic-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.lcic-toolbar .spacer { flex: 1; }
.lcic-scope .cmp, .lcic-scope .lang { display: flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 100px; }
.lcic-scope .cmp button, .lcic-scope .lang button {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 0; border-radius: 100px;
  background: transparent; color: var(--secondary); font-size: .9375rem; cursor: pointer; transition: background .15s, color .15s;
}
.lcic-scope .lang button { padding: 8px 13px; font-size: .875rem; font-weight: 600; }
.lcic-scope .cmp button.active, .lcic-scope .lang button.active { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--ctl-shadow); }
.lcic-scope .cmp .ico { width: 22px; height: 0; border-top: 3px solid var(--s1); border-radius: 2px; }
.lcic-scope .cmp .ico.ref { border-top: 2px dashed var(--ref); }
.lcic-scope .gap { display: inline-flex; align-items: center; gap: 10px; padding: 6px 18px; border-radius: 100px; background: var(--surface); transition: background .2s; }
.lcic-scope .gap[hidden] { display: none; }
.lcic-scope .gap .big { font-size: 1.75rem; font-weight: 750; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.lcic-scope .gap .lab { font-size: .75rem; line-height: 1.25; color: var(--secondary); }
.lcic-scope .gap.better { background: var(--good-soft); } .lcic-scope .gap.better .big { color: var(--good); }
.lcic-scope .gap.worse { background: var(--bad-soft); } .lcic-scope .gap.worse .big { color: var(--bad); }
.lcic-scope .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px;
  border: 1px solid var(--line); border-radius: 100px; background: var(--surface); color: var(--text);
  font-size: .9375rem; font-weight: 550; cursor: pointer; transition: border-color .2s, transform .2s;
}
.lcic-scope .btn.icon { width: 48px; padding: 0; }
.lcic-scope .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) and (pointer: fine) {
  .lcic-scope .btn:hover { border-color: var(--violet); transform: translateY(-1px); }
  .lcic-scope .cmp button:not(.active):hover, .lcic-scope .lang button:not(.active):hover { color: var(--text); }
}

/* Grille : réglages à gauche, graphiques et lecture à droite */
.lcic-body {
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 520px) minmax(0, 1fr);
  grid-template-areas: "params charts";
}
.lcic-charts { grid-area: charts; display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 16px; min-width: 0; }
.lcic-scope .params { grid-area: params; }

.lcic-scope .card {
  min-width: 0; display: flex; flex-direction: column; padding: 20px 22px;
  border: 1px solid var(--line); border-radius: 22px; background: var(--card-tint), var(--card);
}
.lcic-scope h2 { margin: 0 0 8px; font-size: 1.125rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; }
.lcic-scope h3 { margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-size: .75rem; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.lcic-scope h3 .tag { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Réglages */
.lcic-scope .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; }
.lcic-scope .col { display: flex; flex-direction: column; gap: 18px; }
.lcic-scope .ctl { margin-bottom: 12px; }
.lcic-scope .ctl:last-child { margin-bottom: 0; }
.lcic-scope .ctl.off { opacity: .38; }
.lcic-scope .ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lcic-scope .ctl-head label, .lcic-scope .ctl-head .lab { font-size: .9375rem; font-weight: 600; }
.lcic-scope .ctl-head output { font-variant-numeric: tabular-nums; font-size: .875rem; color: var(--secondary); text-align: right; }
.lcic-scope input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: var(--accent); }
.lcic-scope .hint { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: .8125rem; color: var(--secondary); font-variant-numeric: tabular-nums; }
.lcic-scope .hint span { display: inline-flex; align-items: center; gap: 5px; }
.lcic-scope .hint i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.lcic-scope .hint b.up { color: var(--bad); } .lcic-scope .hint b.down { color: var(--good); }

/* Choix : contrôle segmenté (libellés longs sur deux lignes si besoin) */
.lcic-scope .seg { display: flex; gap: 2px; margin-top: 8px; padding: 3px; background: var(--track); border-radius: 12px; }
.lcic-scope .seg button {
  flex: 1; min-width: 0; padding: 7px 3px; border: 0; border-radius: 9px; background: transparent; color: var(--secondary);
  font-size: .8125rem; line-height: 1.2; cursor: pointer; transition: background .15s, color .15s;
}
.lcic-scope .seg button.active { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--ctl-shadow); }

/* Interrupteur */
.lcic-scope .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9375rem; font-weight: 600; }
.lcic-scope .switch > span:first-child { flex: 1; }
.lcic-scope .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lcic-scope .switch .track { flex: none; width: 44px; height: 26px; border-radius: 999px; background: var(--track); position: relative; transition: background .2s; }
.lcic-scope .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); }
.lcic-scope .switch input:checked + .track { background: var(--on); }
.lcic-scope .switch input:checked + .track::after { transform: translateX(18px); }
.lcic-scope .switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 3px; }

/* Comprendre la courbe */
.lcic-scope .read ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
.lcic-scope .read .ri {
  width: 100%; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; text-align: left;
  font-size: .875rem; color: var(--secondary); line-height: 1.4; background: transparent;
  border: 1px solid transparent; border-radius: 14px; padding: 6px 8px; margin: -7px -9px; cursor: pointer;
  transition: opacity .15s, background .15s, border-color .15s;
}
.lcic-scope .read .ri:hover { background: var(--surface); }
.lcic-scope .read .ri.active { background: var(--card); border-color: var(--line); box-shadow: var(--ctl-shadow); }
.lcic-scope .read.focused .ri:not(.active) { opacity: .45; }
.lcic-scope .read .ri b { display: block; color: var(--text); font-size: .9375rem; font-weight: 600; }
.lcic-scope .read .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.lcic-scope .read .ic svg { width: 18px; height: 18px; }


/* Graphiques : la zone de dessin prend toute la place restante de la carte */
.lcic-scope .chart { position: relative; flex: 1; min-height: 380px; }
.lcic-scope .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lcic-scope .chart text { fill: var(--secondary); font-size: 13px; font-family: inherit; }
.lcic-scope .chart text.in-bar { fill: #fff; font-size: 12.5px; font-weight: 600; pointer-events: none; }
.lcic-scope .chart .axis-title { fill: var(--muted); font-size: 13px; }
.lcic-scope .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8125rem; color: var(--secondary); margin: 0 0 8px; }
.lcic-scope .legend span { display: inline-flex; align-items: center; gap: 6px; }
.lcic-scope .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.lcic-scope .sw.line { height: 3px; border-radius: 2px; width: 16px; }
.lcic-scope .sw.dash { height: 0; border-top: 2px dashed var(--ref); background: none !important; width: 16px; }
.lcic-scope .sw.dot { border-radius: 50%; width: 10px; height: 10px; }
.lcic-scope .sw.dia { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); }
.lcic-scope .tip {
  position: absolute; pointer-events: none; background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .14); white-space: nowrap; opacity: 0; transition: opacity .08s; z-index: 5;
}

/* ---------- Tablettes et petites fenêtres : graphiques, puis réglages, puis lecture ---------- */
@media (max-width: 1100px) {
  .lcic { width: calc(100% - 56px); }
  .lcic-intro { grid-template-columns: minmax(0, 1fr); }
  .lcic-scope.lcic-intro .read ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
  .lcic-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "charts" "params"; }
  .lcic-charts { grid-template-columns: minmax(0, 1fr) 230px; }
  .lcic-scope .chart { flex: none; height: 400px; min-height: 0; }
  .lcic-scope .tip { white-space: normal; max-width: 240px; }
}
/* ---------- Téléphones ---------- */
@media (max-width: 680px) {
  .lcic { width: calc(100% - 28px); font-size: 14px; }
  .lcic-toolbar { gap: 10px; }
  .lcic-toolbar .spacer { display: none; }
  .lcic-scope .cmp { flex: 1 1 100%; }
  .lcic-scope .cmp button { flex: 1; justify-content: center; padding: 8px 10px; font-size: .8125rem; text-align: left; }
  .lcic-scope .gap { flex: 1 1 100%; justify-content: center; }
  .lcic-scope .btn { min-height: 44px; padding: 8px 16px; }
  .lcic-scope .btn.icon { width: 44px; }
  .lcic-scope .toolbar-end { margin-left: auto; display: flex; gap: 10px; }
  .lcic-body { grid-template-areas: "params" "charts"; }   /* téléphone : réglages d'abord, puis les graphiques */
  .lcic-charts { grid-template-columns: minmax(0, 1fr); }
  .lcic-scope .card { padding: 16px; border-radius: 18px; }
  .lcic-scope .chart { height: clamp(250px, 72vw, 380px); }
  .lcic-scope #chart-phases { height: clamp(220px, 60vw, 320px); }
  .lcic-scope .cols { grid-template-columns: minmax(0, 1fr); }
  .lcic-scope.lcic-intro .read ul { grid-template-columns: minmax(0, 1fr); }
  .lcic-lead { font-size: 1.125rem; }
  .lcic-scope input[type="range"] { height: 28px; }
  .lcic-scope .seg button { padding: 9px 3px; }
}
.lcic-scope .toolbar-end { display: flex; gap: 12px; }
@media (max-width: 680px) { .lcic-scope .toolbar-end { gap: 10px; } }
@media print { .lcic-toolbar .btn, .lcic-scope .lang { display: none; } }
  </style>
</head>

                <div id="g-use"><h3><i class="tag" style="background:var(--s2)"></i><span data-i18n="gUse"></span></h3></div>
                <div id="g-eou"><h3><i class="tag" style="background:var(--s5)"></i><span data-i18n="gEou"></span></h3></div>
              </div>
            </div>

<script>
"use strict";

/* ---------- Textes FR / EN ---------- */
const STR = {
  fr: {
    title: '<span class="gradient-text">CICV</span> paramétrique.', docTitle: "CICV paramétrique",
    eyebrow: "OUTIL INTERACTIF · COURBE D'IMPACT SUR LE CYCLE DE VIE",
    intro: "Explorez comment les choix de conception, d'usage et de fin d'usage façonnent l'impact environnemental cumulé d'un convertisseur d'électronique de puissance. Valeurs illustratives : seules les tendances comptent.",
    scenario: "Scénario", compare: "Comparer à la référence linéaire", ref: "Référence", gapLab: "d'impact<br>vs référence",
    reset: "Reset",
    gUf: "Unité fonctionnelle", gFab: "Fabrication", gUse: "Usage", gEou: "Fin d'usage",
    T: "Durée d'usage", c: "Calibre", mod: "Modularité / diagnostic", s: "Matière secondaire",
    q: "Qualité du secondaire", Lf: "Durée de vie avant défaillance", fix: "À chaque défaillance",
    neuf: "Pièce neuve", rep: "Pièce réparée", mix: "Mix électrique", renouv: "Renouve\u00ADlable", nucl: "Nucléaire", charbon: "Charbon",
    eou: "Scénario", elim: "Élimination", recyc: "Recyclage", repair: "Réparation", eta: "Performance de recyclage",
    years: "ans", hFab: "fabrication", hLoss: "pertes", hLife: "durée de vie",
    readTitle: "Comprendre la courbe",
    readFab: "saut initial à t = 0", readUse: "pente : pertes électriques × mix",
    readFail: "saut : pièce + fin d'usage de la pièce retirée", readEou: "saut final : charge, ou crédit si on recycle ou répare",
    cicvTitle: "Courbe d'impact sur le cycle de vie", phasesTitle: "Impact par phase",
    legFail: "Défaillance", offScale: "↑ hors échelle", effLife: "durée de vie effective",
    phFab: "Fabrication", phUse: "Usage", phFail: "Défaillances", phEou: "Fin d'usage", isCredit: " (crédit)",
    axCum: "Impact cumulé",
  },
  en: {
    title: 'Parametric <span class="gradient-text">LCIC.</span>', docTitle: "Parametric LCIC",
    eyebrow: "INTERACTIVE TOOL · LIFE CYCLE IMPACT CURVE",
    intro: "Explore how design, use and end-of-use choices shape the cumulative environmental impact of a power electronic converter. Values are illustrative: only trends matter.",
    scenario: "Scenario", compare: "Compare with linear baseline", ref: "Baseline", gapLab: "impact<br>vs baseline",
    reset: "Reset",
    gUf: "Functional unit", gFab: "Manufacturing", gUse: "Use", gEou: "End of use",
    T: "Use duration", c: "Rating", mod: "Modularity / diagnostics", s: "Secondary material",
    q: "Secondary quality", Lf: "Time to failure", fix: "At each failure",
    neuf: "New part", rep: "Repaired part", mix: "Electricity mix", renouv: "Renewable", nucl: "Nuclear", charbon: "Coal",
    eou: "Scenario", elim: "Disposal", recyc: "Recycling", repair: "Repair", eta: "Recycling performance",
    years: "yrs", hFab: "manufacturing", hLoss: "losses", hLife: "lifetime",
    readTitle: "Understanding the curve",
    readFab: "initial jump at t = 0", readUse: "slope: electrical losses × mix",
    readFail: "jump: part + end of use of the removed part", readEou: "final jump: burden, or credit when recycling or repairing",
    cicvTitle: "Life cycle impact curve", phasesTitle: "Impact by phase",
    legFail: "Failure", offScale: "↑ off scale", effLife: "effective lifetime",
    phFab: "Production", phUse: "Use", phFail: "Failures", phEou: "End of use", isCredit: " (credit)",
    axCum: "Cumulative impact",
  },
};
// Langue commune au site (assets/i18n.js) : bouton drapeau de l'en-tête
let lang = (window.PELCA_I18N && window.PELCA_I18N.lang) || "en";
const tr = k => (STR[lang] || STR.en)[k];

/* ---------- Données illustratives ---------- */
// Valeurs non scientifiques : seules les tendances comptent (rien n'est affiché en valeur absolue).
const C = {
  Mv: 450,        // matière vierge d'un produit de calibre 0,5 (la matière pèse lourd : le secondaire se voit)
  P: 150,         // procédés de fabrication
  rSec: 0.2,      // matière secondaire / vierge
  interv: 30,     // intervention de maintenance (déplacement, diagnostic)
  cRep: 0.25,     // pièce réparée : part refaite
  ED: 150,        // élimination (enfouissement, incinération)
  Erec: 150,      // procédé de recyclage : à 50 % de performance, charge = crédit
  vRec: 1.0,      // crédit : matière vierge évitée
  maxRecCredit: 0.92, // crédit net de recyclage plafonné à 92 % de F
  cRem: 0.05,     // remise en état en fin d'usage : petite charge, part de F
  vReuse: 1.0,    // crédit : fabrication évitée (= F)
};
const E0 = 50;  // pertes électriques par an au calibre 0,5 : usage du même ordre que la fabrication
// Facteurs très exagérés pour la pédagogie (pente charbon > nucléaire > renouvelable,
// écarts bien visibles) : en ACV, nucléaire et éolien sont du même ordre (~0,01 kg CO2-éq/kWh).
const MIX = { renouv: 0.250, nucl: 0.820, charbon: 1.300 };
const F_MOD = 0.4;  // part du produit remplacée à chaque défaillance si modulaire
const T_MAX = 30;   // borne de la durée d'usage = largeur fixe de l'axe du temps
// Échelles d'impact fixes : les effets se comparent d'un réglage à l'autre ; les cas
// extrêmes sortent du cadre (signalés « hors échelle »). La CICV part de 0 (cumul
// positif) ; les barres gardent une partie négative pour les crédits de fin d'usage.
const Y_MAX = 7000;
const Y_RANGE = [0, Y_MAX], Y_RANGE_BARS = [-1000, Y_MAX];

/* ---------- Paramètres ---------- */
// type, groupe, clé, ... (range : min, max, pas, format ; choice : options → clés de texte)
const CONTROLS = [
  ["range", "g-uf", "T", 5, T_MAX, 1, "ans"],

  ["range", "g-fab", "c", 0, 1, 0.05, "n2"],
  ["switch", "g-fab", "mod"],
  ["range", "g-fab", "s", 0, 1, 0.25, "pct"],
  ["range", "g-fab", "q", 0.5, 1, 0.05, "pct"],

  ["range", "g-use", "Lf", 8, 30, 1, "life"],
  ["choice", "g-use", "fix", { neuf: "neuf", rep: "rep" }],
  ["choice", "g-use", "mix", { renouv: "renouv", nucl: "nucl", charbon: "charbon" }],

  ["choice", "g-eou", "eou", { elim: "elim", recyc: "recyc", rep: "repair" }],
  ["range", "g-eou", "eta", 0, 1, 0.05, "pct"],
];

const BASE = { T: 30, c: 0.5, mod: false, s: 0, q: 1, Lf: 15, fix: "neuf", mix: "nucl", eou: "elim", eta: 0.5 };
// Référence linéaire = réglages du Reset ; seule l'unité fonctionnelle suit le scénario
const REF = { ...BASE };

const state = { ...BASE };
let compare = false;
let focus = null;   // phase mise en avant (« Comprendre la courbe ») : fab, use, fail, eou ou null
const refOf = s => ({ ...REF, T: s.T });

/* ---------- Modèle ---------- */
// Calibre c : taille k (fabrication, fin d'usage, durée de vie) et facteur de pertes,
// tous deux égaux à 1 pour c = 0,5. Pertes exagérées (au cube) pour que la pente se voie.
const sizeOf = c => 0.4 + 1.2 * c;
const lossOf = c => Math.pow(0.75 / (0.25 + c), 3);
// Qualité effective du mélange : sans secondaire ou à qualité égale, facteur 1.
// Loi illustrative : à 100 % secondaire et q = 50 %, les pertes sont multipliées par 4 (effet pédagogique accentué).
const qualityLossOf = s => Math.pow(1 / (1 - s.s * (1 - s.q)), 2);
// Durée de vie effective : un petit calibre travaille près de ses limites (k < 1) et un
// secondaire de qualité q dégradée vieillit plus vite (au pire, s = 100 % et q = 50 % : L / 2).
// Plancher d'un an pour garder une courbe lisible.
const lifeOf = s => Math.max(s.Lf * sizeOf(s.c) * (1 - s.s * (1 - s.q)), 1);

function model(s) {
  const k = sizeOf(s.c);
  const F = k * (C.Mv * ((1 - s.s) + s.s * C.rSec) + C.P) * (s.mod ? 1.1 : 1);
  const rate = E0 * lossOf(s.c) * qualityLossOf(s) * MIX[s.mix];

  // Fin d'usage = charge (procédé) + crédit (matière ou produit évité)
  const recCharge = k * (C.Erec + (1 - s.eta) * C.ED), recCredit = -k * s.eta * C.Mv * C.vRec;
  const [fduCharge, fduCredit] = s.eou === "elim" ? [k * C.ED, 0]
    : s.eou === "recyc" ? [recCharge, recCredit]
    : [C.cRem * F, -C.vReuse * F];
  // Convention pédagogique : le crédit net ne peut dépasser la fabrication
  // du produit concerné. Ainsi F + fdu >= 0, chaque remplacement reste
  // positif et le cumul final ne peut devenir négatif, même à usage court.
  // Hiérarchie pédagogique : conserver le produit (réparation, crédit net
  // de 95 % de F) apporte toujours plus que récupérer sa matière (≤ 92 %).
  const creditLimit = s.eou === "recyc" ? C.maxRecCredit * F : F;
  const fdu = Math.max(fduCharge + fduCredit, -creditLimit);

  // Une défaillance à chaque multiple de la durée de vie effective avant T.
  // Pièce neuve : tout le sous-ensemble est refait ; pièce réparée : seule une part c_rép.
  // Dans les deux cas, ce qui est retiré suit le scénario de fin d'usage.
  const life = lifeOf(s);
  const kf = (s.mod ? F_MOD : 1) * (s.fix === "neuf" ? 1 : C.cRep);
  const failCost = C.interv + kf * (F + fdu);

  const events = [];
  for (let i = 1; i * life < s.T - 1e-9; i++) events.push({ t: i * life, dy: failCost });

  const ph = { fab: F, use: rate * s.T, fail: events.length * failCost, eou: fdu };
  const total = ph.fab + ph.use + ph.fail + ph.eou;
  return { F, rate, fdu, events, ph, total, T: s.T };
}

function curve(r) {
  const pts = [[0, 0], [0, r.F]];
  let y = r.F, t = 0;
  for (const e of r.events) {
    y += r.rate * (e.t - t); t = e.t;
    pts.push([t, y]);
    y += e.dy;
    pts.push([t, y]);
    e.y = y;
  }
  y += r.rate * (r.T - t);
  pts.push([r.T, y]);
  y += r.fdu;
  pts.push([r.T, y]);
  return pts;
}

/* ---------- Formatage ---------- */
const nf = (v, d = 1) => v.toLocaleString(lang === "fr" ? "fr-FR" : "en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
function fmtCtl(f, v) {
  if (f === "pct") return nf(v * 100, 0) + " %";
  if (f === "ans") return nf(v, 0) + " " + tr("years");
  if (f === "life") {   // durée nominale → durée effective (calibre, qualité du secondaire)
    const L = lifeOf(state);
    return Math.abs(L - v) < 0.05 ? fmtCtl("ans", v)
      : `${nf(v, 0)} → <b title="${tr("effLife")}">${nf(L, 1)}</b> ${tr("years")}`;
  }
  return nf(v, 2);
}

/* ---------- Aides SVG ---------- */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  if (parent) parent.appendChild(e);
  return e;
}
function niceTicks(min, max, n = 5) {
  if (max === min) max = min + 1;
  const step0 = (max - min) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { ticks, lo, hi };
}
// Le viewBox prend la taille réelle de la zone : le texte s'affiche à sa taille nominale.
function makeSvg(box, label) {
  box.innerHTML = "";
  const W = box.clientWidth || 600, H = box.clientHeight || 300;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label }, box);
  const tip = document.createElement("div");
  tip.className = "tip";
  box.appendChild(tip);
  return { svg, tip, W, H };
}
function placeTip(box, tip, x, y) {
  tip.style.opacity = 1;
  const cw = box.clientWidth, tw = tip.offsetWidth;
  let left = x + 14;
  if (left + tw > cw) left = x - tw - 14;
  tip.style.left = Math.max(0, left) + "px";
  tip.style.top = Math.max(0, y - 10) + "px";
}
function hoverTip(box, tip, target, html) {
  target.addEventListener("pointermove", evt => {
    tip.innerHTML = html;
    const rb = box.getBoundingClientRect(), k = box.clientWidth / rb.width || 1;
    placeTip(box, tip, (evt.clientX - rb.left) * k, (evt.clientY - rb.top) * k);
  });
  target.addEventListener("pointerleave", () => { tip.style.opacity = 0; });
}
// Grille horizontale sans valeurs : seules les tendances comptent
function yGrid(svg, ty, Y, m, W) {
  ty.ticks.forEach(v => el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)" }, svg));
}
function yTitle(svg, m, H, txt) {
  const yMid = m.t + (H - m.t - m.b) / 2;
  el("text", { x: 12, y: yMid, "text-anchor": "middle", class: "axis-title", transform: `rotate(-90 12 ${yMid})` }, svg).textContent = txt;
}
const M = { l: 30, r: 14, t: 10, b: 30 };

/* ---------- CICV ---------- */
function clipTo(svg, id, m, W, H) {
  const clip = "clip-" + id;
  el("rect", { x: m.l - 8, y: m.t - 6, width: W - m.l - m.r + 16, height: H - m.t - m.b + 12 }, el("clipPath", { id: clip }, el("defs", {}, svg)));
  return el("g", { "clip-path": `url(#${clip})` }, svg);
}
function offScale(svg, W, m, show) {
  if (show) el("text", { x: W - m.r, y: m.t + 14, "text-anchor": "end", class: "axis-title" }, svg).textContent = tr("offScale");
}
function drawCicv(id, r, rr) {
  const box = document.getElementById(id);
  const { svg, W, H } = makeSvg(box, tr("cicvTitle"));
  const m = M, T = r.T;
  const t0 = -0.01 * T_MAX, t1 = 1.01 * T_MAX;   // axes fixes : marge pour voir les sauts à 0
  const runs = [r].concat(rr ? [rr] : []);
  const curves = runs.map(curve);
  const ty = niceTicks(Y_RANGE[0], Y_RANGE[1], 6);
  const X = t => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - ty.lo) / (ty.hi - ty.lo)) * (H - m.t - m.b);
  yGrid(svg, ty, Y, m, W);
  niceTicks(0, T_MAX, 6).ticks.forEach(t => {
    el("text", { x: X(t), y: H - m.b + 20, "text-anchor": "middle" }, svg).textContent = nf(t, 0);
  });
  // Unité au-dessus de l'axe, dans le coin bas-droit (vide : la courbe y est toujours haute)
  el("text", { x: W - m.r, y: H - m.b - 8, "text-anchor": "end", class: "axis-title" }, svg).textContent = tr("years") + " →";
  yTitle(svg, m, H, tr("axCum"));
  offScale(svg, W, m, curves.some(c => c.some(p => p[1] > ty.hi || p[1] < ty.lo)));

  const g = clipTo(svg, id, m, W, H);
  const path = pts => pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  if (rr) el("path", { d: path(curves[1]), fill: "none", stroke: "var(--ref)", "stroke-width": 2, "stroke-dasharray": "6 4", "stroke-linejoin": "round", opacity: focus ? 0.4 : 1 }, g);
  el("path", { d: path(curves[0]), fill: "none", stroke: focus ? "var(--axis)" : "var(--s1)", "stroke-width": 2.5, "stroke-linejoin": "round" }, g);
  if (focus) {
    // Segments de la courbe appartenant à la phase choisie, dans sa couleur
    const pc = curves[0], segs = [];
    for (let i = 1; i < pc.length; i++) {
      const [a, b] = [pc[i - 1], pc[i]];
      const kind = a[0] !== b[0] ? "use" : a[0] === 0 ? "fab" : i === pc.length - 1 ? "eou" : "fail";
      if (kind === focus) segs.push(`M${X(a[0]).toFixed(1)} ${Y(a[1]).toFixed(1)}L${X(b[0]).toFixed(1)} ${Y(b[1]).toFixed(1)}`);
    }
    const col = { fab: "--s1", use: "--s2", fail: "--s3", eou: "--s5" }[focus];
    el("path", { d: segs.join(""), fill: "none", stroke: `var(${col})`, "stroke-width": 4.5, "stroke-linecap": "round" }, g);
  }
  // Marqueurs affichés par défaut, masqués quand une autre phase est mise en avant
  if (!focus || focus === "fail") r.events.forEach(e => el("circle", { cx: X(e.t), cy: Y(e.y), r: 5, fill: "var(--s3)", stroke: "var(--card)", "stroke-width": 2 }, g));
  if (!focus || focus === "eou") el("rect", { x: X(T) - 5, y: Y(r.total) - 5, width: 10, height: 10, rx: 2, fill: "var(--s5)", stroke: "var(--card)", "stroke-width": 2, transform: `rotate(45 ${X(T)} ${Y(r.total)})` }, g);
  if (rr) el("circle", { cx: X(T), cy: Y(rr.total), r: 4, fill: "var(--ref)", stroke: "var(--card)", "stroke-width": 2 }, g);
}

/* ---------- Impact par phase ---------- */
// Texte centré dans un segment : taille normale, puis réduite, sinon rien.
// On mesure le libellé dans les deux langues : FR et EN s'affichent dans les mêmes cas.
function inBar(g, key, cx, top, bot, bw) {
  for (const fs of [12.5, 11]) {
    if (bot - top < fs + 7) return;
    const t = el("text", { x: cx, y: (top + bot) / 2 + fs * 0.36, "text-anchor": "middle", class: "in-bar", style: `font-size:${fs}px` }, g);
    const w = Math.max(...Object.keys(STR).map(l => { t.textContent = STR[l][key]; return t.getComputedTextLength(); }));
    t.textContent = tr(key);
    if (w <= bw - 10) return;
    t.remove();
  }
}
const PHASES = [["fab", "phFab", "--s1"], ["use", "phUse", "--s2"], ["fail", "phFail", "--s3"], ["eou", "phEou", "--s5"]];
function drawPhases(r, rr) {
  document.getElementById("legend-phases").innerHTML = PHASES.map(([, n, c]) =>
    `<span><i class="sw" style="background:var(${c})"></i>${tr(n)}</span>`).join("");
  const box = document.getElementById("chart-phases");
  const { svg, tip, W, H } = makeSvg(box, tr("phasesTitle"));
  const m = { l: 14, r: 14, t: 10, b: 30 };
  const bars = rr ? [[tr("ref"), rr], [tr("scenario"), r]] : [[tr("scenario"), r]];
  const ty = niceTicks(Y_RANGE_BARS[0], Y_RANGE_BARS[1], 6);   // même plafond que la CICV
  const Y = v => m.t + (1 - (v - ty.lo) / (ty.hi - ty.lo)) * (H - m.t - m.b);
  yGrid(svg, ty, Y, m, W);
  let out = false;
  const slot = (W - m.l - m.r) / 2, bw = Math.min(110, slot * 0.86);
  bars.forEach(([name, d], i) => {
    const cx = m.l + slot * (bars.length === 1 ? 1 : i + 0.5);
    el("text", { x: cx, y: H - m.b + 20, "text-anchor": "middle" }, svg).textContent = name;
    let up = 0, down = 0;
    const g = clipTo(svg, "phases-" + i, m, W, H);
    PHASES.forEach(([k, n, c]) => {
      const v = d.ph[k], label = tr(n);
      if (Math.abs(v) < 1e-9) return;
      let y0, y1;
      if (v >= 0) { y0 = up; y1 = up + v; up = y1; } else { y0 = down; y1 = down + v; down = y1; }
      if (Math.max(y0, y1) > ty.hi || Math.min(y0, y1) < ty.lo) out = true;
      const top = Math.max(Y(Math.max(y0, y1)), m.t), bot = Math.min(Y(Math.min(y0, y1)), H - m.b);
      if (bot <= top) return;
      const rect = el("rect", { x: cx - bw / 2, y: top + 1, width: bw, height: Math.max(bot - top - 2, 0.5), rx: 3, fill: `var(${c})`, opacity: focus && focus !== k ? 0.22 : 1 }, g);
      hoverTip(box, tip, rect, `<b>${name}</b> · ${label}${v < 0 ? tr("isCredit") : ""}`);
      // Libellé dans le segment s'il y tient (largeur mesurée) ; sinon il reste au survol
      if (!focus || focus === k) inBar(g, n, cx, top, bot, bw);
    });
  });
  offScale(svg, W, m, out);
}

/* ---------- Rendu ---------- */
function render() {
  const r = model(state), rr = compare ? model(refOf(state)) : null;
  document.getElementById("leg-ref").style.display = rr ? "" : "none";
  document.getElementById("leg-fail").style.display = !focus || focus === "fail" ? "" : "none";
  document.getElementById("leg-eou").style.display = !focus || focus === "eou" ? "" : "none";
  const gap = document.getElementById("gap");
  gap.hidden = !rr;
  if (rr) {
    const g = (r.total - rr.total) / Math.abs(rr.total) * 100;
    document.getElementById("gap-big").textContent = `${g > 0.5 ? "+" : g < -0.5 ? "−" : ""}${nf(Math.abs(g), 0)} %`;
    gap.className = "gap " + (g < -0.5 ? "better" : g > 0.5 ? "worse" : "");
  }
  document.querySelector(".read").classList.toggle("focused", !!focus);
  document.querySelectorAll(".ri").forEach(b => {
    b.classList.toggle("active", b.dataset.ph === focus);
    b.setAttribute("aria-pressed", String(b.dataset.ph === focus));
  });
  drawCicv("chart-cicv", r, rr);
  drawPhases(r, rr);
}
let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }

/* ---------- Contrôles ---------- */
function buildControls() {
  document.querySelectorAll(".ctl").forEach(n => n.remove());
  CONTROLS.forEach(([type, g, key, ...rest]) => {
    const div = document.createElement("div");
    div.className = "ctl"; div.id = "ctl-" + key;
    const label = tr(key);
    if (type === "range") {
      const [min, max, step] = rest;
      div.innerHTML = `<div class="ctl-head"><label for="in-${key}">${label}</label><output id="out-${key}"></output></div>
        <input type="range" id="in-${key}" min="${min}" max="${max}" step="${step}">${key === "c" ? '<div class="hint" id="hint-c"></div>' : ""}`;
      div.querySelector("input").addEventListener("input", e => { state[key] = Number(e.target.value); changed(); });
    } else if (type === "choice") {
      const [opts] = rest;
      div.innerHTML = `<div class="ctl-head"><span class="lab">${label}</span></div><div class="seg" role="radiogroup" aria-label="${label}"></div>`;
      const seg = div.querySelector(".seg");
      Object.entries(opts).forEach(([v, txt]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = tr(txt); b.dataset.key = key; b.dataset.v = v;
        b.addEventListener("click", () => { state[key] = v; changed(); });
        seg.appendChild(b);
      });
    } else if (type === "switch") {
      div.innerHTML = `<label class="switch"><span>${label}</span><input type="checkbox" role="switch" id="in-${key}"><span class="track"></span></label>`;
      div.querySelector("input").addEventListener("change", e => { state[key] = e.target.checked; changed(); });
    }
    document.getElementById(g).appendChild(div);
  });
}
function changed() { syncInputs(); schedule(); }
function syncInputs() {
  CONTROLS.forEach(([type, , key, ...rest]) => {
    if (type === "range") {
      document.getElementById("in-" + key).value = state[key];
      document.getElementById("out-" + key).innerHTML = fmtCtl(rest[3], state[key]);
    } else if (type === "switch") {
      document.getElementById("in-" + key).checked = !!state[key];
    }
  });
  document.getElementById("out-q").innerHTML += ` · ${tr("hLoss")} ×${nf(qualityLossOf(state), 2)}`;
  // Les trois effets du calibre, en couleur de phase ; rouge = impact en hausse
  const fx = [["--s1", "hFab", sizeOf(state.c)], ["--s2", "hLoss", lossOf(state.c)], ["--s3", "hLife", sizeOf(state.c), true]];
  document.getElementById("hint-c").innerHTML = fx.map(([col, k, v, inv]) => {
    const cls = Math.abs(v - 1) < 0.005 ? "" : (v > 1) !== !!inv ? "up" : "down";
    return `<span><i style="background:var(${col})"></i>${tr(k)} <b class="${cls}">×${nf(v, 1)}</b></span>`;
  }).join("");
  document.querySelectorAll(".seg button[data-key]").forEach(b => {
    const on = state[b.dataset.key] === b.dataset.v;
    b.classList.toggle("active", on);
    b.setAttribute("aria-checked", on);
  });
  document.querySelectorAll(".cmp button").forEach(b => {
    const on = (b.dataset.cmp === "1") === compare;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on);
  });
  // Curseurs sans effet : performance hors recyclage, qualité sans matière secondaire
  [["eta", state.eou !== "recyc"], ["q", state.s === 0]].forEach(([key, off]) => {
    document.getElementById("ctl-" + key).classList.toggle("off", off);
    document.getElementById("in-" + key).disabled = off;
  });
}
// Textes statiques de la page
function applyLang() {
  document.documentElement.lang = lang;
  document.title = "PELCA — " + tr("docTitle");
  document.getElementById("title").innerHTML = tr("title");
  document.querySelectorAll("[data-i18n]").forEach(n => { n.textContent = tr(n.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(n => { n.innerHTML = tr(n.dataset.i18nHtml); });
  document.querySelector(".cmp").setAttribute("aria-label", tr("compare"));
  buildControls();
  syncInputs();
}

document.querySelectorAll(".cmp button").forEach(b =>
  b.addEventListener("click", () => { compare = b.dataset.cmp === "1"; changed(); }));
addEventListener("pelca:lang", e => { lang = e.detail; applyLang(); render(); });
document.getElementById("restart").addEventListener("click", () => { Object.assign(state, BASE); compare = false; focus = null; changed(); });
// « Comprendre la courbe » : un clic met la phase en avant, un second clic revient à tout
document.querySelectorAll(".ri").forEach(b =>
  b.addEventListener("click", () => { focus = focus === b.dataset.ph ? null : b.dataset.ph; schedule(); }));

// Les graphiques mesurent leur zone : on les redessine quand la fenêtre change
addEventListener("resize", schedule);

applyLang();
render();
</script>
</body>
</html>
